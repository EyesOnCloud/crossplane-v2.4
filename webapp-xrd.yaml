apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapps.platform.example.com
spec:
  scope: Namespaced
  group: platform.example.com
  names:
    kind: WebApp
    plural: webapps
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              image:
                type: string
              replicas:
                type: integer
                minimum: 1
            required:
            - image
            - replicas
          status:
            type: object
            properties:
              availableReplicas:
                type: integer
              rolloutStatus:
                type: string
