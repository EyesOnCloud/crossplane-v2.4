apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  name: portal-public-subnet
  namespace: portal-network
spec:
  forProvider:
    region: us-east-1
    availabilityZone: us-east-1a
    cidrBlock: 10.30.1.0/24
    mapPublicIpOnLaunch: true
    vpcIdRef:
      name: portal-vpc
    tags:
      Name: portal-public-subnet
      tier: public
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
