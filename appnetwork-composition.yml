apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appnetwork-aws
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: AppNetwork
  mode: Pipeline
  pipeline:
  - step: compose-network
    functionRef:
      name: crossplane-contrib-function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      patchSets:
      - name: environment-tag
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.tags.environment
      resources:
      # ---------- VPC ----------
      - name: vpc
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: VPC
          spec:
            forProvider:
              region: $region
              enableDnsSupport: true
              enableDnsHostnames: true
              tags:
                managed-by: platform-team
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: spec.vpcCidr
          toFieldPath: spec.forProvider.cidrBlock
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-vpc"
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.vpcId
      # ---------- Internet Gateway ----------
      - name: internet-gateway
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: InternetGateway
          spec:
            forProvider:
              region: $region
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: platform-team
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-igw"
      # ---------- Public subnet ----------
      - name: public-subnet
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: Subnet
          metadata:
            labels:
              tier: public
          spec:
            forProvider:
              region: $region
              availabilityZone: $az_a
              mapPublicIpOnLaunch: true
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: platform-team
                tier: public
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: spec.publicSubnetCidr
          toFieldPath: spec.forProvider.cidrBlock
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-public-subnet"
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.publicSubnetId
      # ---------- Private subnet ----------
      - name: private-subnet
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: Subnet
          metadata:
            labels:
              tier: private
          spec:
            forProvider:
              region: $region
              availabilityZone: $az_a
              mapPublicIpOnLaunch: false
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: platform-team
                tier: private
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: spec.privateSubnetCidr
          toFieldPath: spec.forProvider.cidrBlock
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-private-subnet"
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.privateSubnetId
      # ---------- Public route table ----------
      - name: public-route-table
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: RouteTable
          metadata:
            labels:
              tier: public
          spec:
            forProvider:
              region: $region
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: platform-team
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-public-rt"
      # ---------- Private route table ----------
      - name: private-route-table
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: RouteTable
          metadata:
            labels:
              tier: private
          spec:
            forProvider:
              region: $region
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: platform-team
        patches:
        - type: PatchSet
          patchSetName: environment-tag
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-private-rt"
      # ---------- Internet route (public only) ----------
      - name: public-internet-route
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: Route
          spec:
            forProvider:
              region: $region
              destinationCidrBlock: 0.0.0.0/0
              routeTableIdSelector:
                matchControllerRef: true
                matchLabels:
                  tier: public
              gatewayIdSelector:
                matchControllerRef: true
      # ---------- Subnet associations ----------
      - name: public-association
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: RouteTableAssociation
          spec:
            forProvider:
              region: $region
              subnetIdSelector:
                matchControllerRef: true
                matchLabels:
                  tier: public
              routeTableIdSelector:
                matchControllerRef: true
                matchLabels:
                  tier: public
      - name: private-association
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: RouteTableAssociation
          spec:
            forProvider:
              region: $region
              subnetIdSelector:
                matchControllerRef: true
                matchLabels:
                  tier: private
              routeTableIdSelector:
                matchControllerRef: true
                matchLabels:
                  tier: private
