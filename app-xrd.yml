apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: applicationsuites.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: ApplicationSuite
    plural: applicationsuites
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              appName:
                type: string
                description: Name of the application suite.
                maxLength: 30
                pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
              components:
                type: array
                description: The components of the application. One Deployment is created per item.
                minItems: 1
                maxItems: 5
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 20
                      pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 3
                      default: 1
                  required:
                  - name
            required:
            - appName
            - components
          status:
            type: object
            properties:
              componentCount:
                type: integer
                description: Number of components generated.
