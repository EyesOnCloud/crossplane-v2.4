apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appserver-aws-isolated
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: AppServer
  mode: Pipeline
  pipeline:
  - step: compose-compute
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      # Isolated network for this server
      - name: network-vpc
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: VPC
          spec:
            forProvider:
              region: us-east-1
              cidrBlock: 10.60.0.0/16
              enableDnsSupport: true
              enableDnsHostnames: true
              tags:
                managed-by: crossplane
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-vpc"
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.tags.environment
      - name: network-subnet
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: Subnet
          spec:
            forProvider:
              region: us-east-1
              availabilityZone: us-east-1a
              cidrBlock: 10.60.1.0/24
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: crossplane
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-subnet"
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.tags.environment
      # Security group with no inbound rules
      - name: server-security-group
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: SecurityGroup
          spec:
            forProvider:
              region: us-east-1
              description: No inbound access. Managed by the compute platform.
              vpcIdSelector:
                matchControllerRef: true
              tags:
                managed-by: crossplane
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-sg"
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-sg"
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.tags.environment
      # The server itself
      - name: app-instance
        base:
          apiVersion: ec2.aws.m.upbound.io/v1beta1
          kind: Instance
          spec:
            forProvider:
              region: us-east-1
              subnetIdSelector:
                matchControllerRef: true
              vpcSecurityGroupIdSelector:
                matchControllerRef: true
              rootBlockDevice:
                encrypted: true
                volumeType: gp3
              metadataOptions:
                httpEndpoint: enabled
                httpTokens: required
              tags:
                managed-by: crossplane
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.size
          toFieldPath: spec.forProvider.instanceType
          transforms:
          - type: map
            map:
              small: t3.micro
              medium: t3.small
        - type: FromCompositeFieldPath
          fromFieldPath: spec.image
          toFieldPath: spec.forProvider.ami
          transforms:
          - type: map
            map:
              amazon-linux-2023: <amazon-linux-2023-ami-id>
              ubuntu-24-04: <ubuntu-24-04-ami-id>
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.monitoring
          transforms:
          - type: map
            map:
              development: "false"
              production: "true"
          - type: convert
            convert:
              toType: bool
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.forProvider.tags.Name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.environment
          toFieldPath: spec.forProvider.tags.environment
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.instanceId
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.privateIp
          toFieldPath: status.privateIp
