apiVersion: platform.example.org/v1alpha1
kind: WebService
metadata:
  name: payments-api
  namespace: webservices
spec:
  environment: prod
  replicas: 2
  features:
    autoscaling:
      enabled: false
    networkPolicy:
      enabled: true
      allowedNamespaces:
      - shared-services
  crossplane:
    compositionRef:
      name: webservice-dynamic
