apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-developer
  namespace: payments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cache-requester
  namespace: payments
rules:
  - apiGroups:
      - cache.platform.example.com
    resources:
      - cacherequests
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-developer-cache-requester
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: payments-developer
    namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cache-requester
---
