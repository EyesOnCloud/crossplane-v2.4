apiVersion: ec2.aws.m.upbound.io/v1beta1
kind: Subnet
metadata:
  name: web-subnet
  namespace: web-network
spec:
  forProvider:
    region: us-east-1
    availabilityZone: us-east-1a
    cidrBlock: 10.20.1.0/24
    vpcIdRef:
      name: app-network
    tags:
      Name: web-subnet
      owner: platform-team
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
