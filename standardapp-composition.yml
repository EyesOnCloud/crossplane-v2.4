apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: standardapp-deployment
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: StandardApp
  mode: Pipeline
  pipeline:
  - step: compose-deployment
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: app-deployment
        base:
          apiVersion: apps/v1
          kind: Deployment
          spec:
            replicas: 1
            template:
              spec:
                containers:
                - name: web
                  image: nginx:1.28
                  ports:
                  - containerPort: 80
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.appName
          toFieldPath: metadata.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-deployment"
        - type: FromCompositeFieldPath
          fromFieldPath: spec.appName
          toFieldPath: spec.selector.matchLabels.app
        - type: FromCompositeFieldPath
          fromFieldPath: spec.appName
          toFieldPath: spec.template.metadata.labels.app
        readinessChecks:
        - type: MatchCondition
          matchCondition:
            type: Available
            status: "True"
