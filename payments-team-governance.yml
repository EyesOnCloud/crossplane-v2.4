apiVersion: v1
kind: Namespace
metadata:
  name: payments-team
  labels:
    platform.example.org/team: payments
    platform.example.org/cost-center: cc-4021
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: payments-quota
  namespace: payments-team
  labels:
    platform.example.org/team: payments
spec:
  hard:
    count/teamservices.platform.example.org: "2"
    pods: "4"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: payments-limits
  namespace: payments-team
  labels:
    platform.example.org/team: payments
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 250m
      memory: 256Mi
    max:
      cpu: 500m
      memory: 512Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: payments-team
  labels:
    platform.example.org/team: payments
rules:
- apiGroups:
  - platform.example.org
  resources:
  - teamservices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - events
  - resourcequotas
  - limitranges
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-developers
  namespace: payments-team
  labels:
    platform.example.org/team: payments
subjects:
- kind: Group
  name: payments-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: team-developer
  apiGroup: rbac.authorization.k8s.io
