 apiVersion: apiextensions.crossplane.io/v1
 kind: Composition
 metadata:
   name: webservice-standard
 spec:
   compositeTypeRef:
     apiVersion: platform.example.org/v1alpha1
     kind: WebService
   mode: Pipeline
   pipeline:
   - step: compose-web-resources
     functionRef:
       name: function-patch-and-transform
     input:
       apiVersion: pt.fn.crossplane.io/v1beta1
       kind: Resources
       resources:
       - name: app-deployment
         base:
           apiVersion: apps/v1
           kind: Deployment
           spec:
             replicas: 1
             template:
               spec:
                 containers:
                 - name: web
                   image: nginx:1.27
                   ports:
                   - containerPort: 80
         patches:
         # Standard: name and labels from appName
         - type: FromCompositeFieldPath
           fromFieldPath: spec.appName
           toFieldPath: metadata.name
           transforms:
           - type: string
             string:
               type: Format
               fmt: "%s-deployment"
           policy:
             fromFieldPath: Required
         - type: FromCompositeFieldPath
           fromFieldPath: spec.appName
           toFieldPath: spec.selector.matchLabels.app
         - type: FromCompositeFieldPath
           fromFieldPath: spec.appName
           toFieldPath: spec.template.metadata.labels.app
         # Data mapping: size -> replica count
         - type: FromCompositeFieldPath
           fromFieldPath: spec.size
           toFieldPath: spec.replicas
           transforms:
           - type: map
             map:
               small: 1
               medium: 2
               large: 3
         # Data mapping: version -> full image name
         - type: FromCompositeFieldPath
           fromFieldPath: spec.imageTag
           toFieldPath: spec.template.spec.containers[0].image
           transforms:
           - type: string
             string:
               type: Format
               fmt: "nginx:%s"
           policy:
             fromFieldPath: Optional
         # Data mapping: team + appName -> cost label
         - type: CombineFromComposite
           combine:
             variables:
             - fromFieldPath: spec.team
             - fromFieldPath: spec.appName
             strategy: string
             string:
               fmt: "%s-%s"
           toFieldPath: metadata.labels.cost-center
         # Data mapping: Deployment status -> XR status
         - type: ToCompositeFieldPath
           fromFieldPath: status.availableReplicas
           toFieldPath: status.availableReplicas
           policy:
             fromFieldPath: Optional
         readinessChecks:
         - type: MatchCondition
           matchCondition:
             type: Available
             status: "True"
       - name: app-service
         base:
           apiVersion: v1
           kind: Service
           spec:
             type: ClusterIP
             ports:
             - port: 80
               targetPort: 80
         patches:
         # Standard: name and selector from appName
         - type: FromCompositeFieldPath
           fromFieldPath: spec.appName
           toFieldPath: metadata.name
           transforms:
           - type: string
             string:
               type: Format
               fmt: "%s-service"
           policy:
             fromFieldPath: Required
         - type: FromCompositeFieldPath
           fromFieldPath: spec.appName
           toFieldPath: spec.selector.app
         # Data mapping: Service name + namespace -> XR status URL
         - type: CombineToComposite
           combine:
             variables:
             - fromFieldPath: metadata.name
             - fromFieldPath: metadata.namespace
             strategy: string
             string:
               fmt: "http://%s.%s.svc.cluster.local"
           toFieldPath: status.url
           policy:
             fromFieldPath: Optional
         readinessChecks:
         - type: None
